    <script>
      (function() {
        // Disable these protections in preview/dev so runtime errors remain visible for debugging.
        const host = window.location.hostname;
        const isPreview = host.includes('lovableproject.com') || host === 'localhost';
        if (isPreview) return;

        // Disable right-click
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        
        // Disable keyboard shortcuts
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12' || 
              (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
              (e.ctrlKey && ['U','u','S','s'].includes(e.key)) ||
              (e.metaKey && e.altKey && ['I','i','J','j'].includes(e.key)) ||
              (e.metaKey && ['U','u','S','s'].includes(e.key))) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        });
        
        // Clear console on load
        if (typeof console.clear === 'function') { console.clear(); }
        
        // Anti-debugging measure
        setInterval(function() {
          if (typeof console.clear === 'function') { console.clear(); }
        }, 3000);
