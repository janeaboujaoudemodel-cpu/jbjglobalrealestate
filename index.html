<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO (JS will enhance per-page) -->
    <title>JBJ Global Real Estate | Dubai Property Brokerage</title>
    <meta name="description" content="JBJ Global Real Estate is Dubai's premier real estate brokerage. Buy, sell, or rent luxury properties in Dubai, UAE." />
    <link rel="canonical" href="https://jbj.ae" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  </head>

  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div style="max-width:720px;">
          <h1 style="margin:0 0 0.75rem;">JBJ Global Real Estate</h1>
          <p style="margin:0 0 0.75rem;">This website requires JavaScript to run.</p>
          <p style="margin:0 0 1rem;">Contact: +971 56 591 1000 | contact@jbj.ae</p>
          <a href="/auth" style="display:inline-block;padding:0.75rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;border:1px solid currentColor;">Team Login</a>
        </div>
      </div>
    </noscript>

    <!-- Kill any legacy service worker/caches that could trap visitors on an old build -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/sw-kill.js?cb=" + Date.now())
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>

    <!-- Boot diagnostic overlay - catches errors ONLY before React mounts -->
    <script>
      (function() {
        // Flag to track if app has mounted - once true, we let React handle errors
        window.__APP_MOUNTED__ = false;
        
        var overlay = null;
        function showError(msg) {
          // Only show boot overlay if app hasn't mounted yet
          // After mount, React error boundaries should handle errors
          if (window.__APP_MOUNTED__) {
            console.error('[Post-mount error - handled by React]:', msg);
            return;
          }
          if (overlay) return;
          overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#000;color:#fff;padding:2rem;font-family:monospace;overflow:auto;';
          overlay.innerHTML = '<h1 style="color:#f00;margin:0 0 1rem;">Boot Error</h1><pre style="white-space:pre-wrap;word-break:break-word;">' + msg + '</pre><p style="margin-top:1rem;color:#888;">Check DevTools Console for details.</p>';
          document.body.appendChild(overlay);
        }
        window.onerror = function(msg, src, line, col, err) {
          showError('Error: ' + msg + '\nSource: ' + src + ':' + line + ':' + col + (err && err.stack ? '\n\nStack:\n' + err.stack : ''));
        };
        window.onunhandledrejection = function(e) {
          var reason = e.reason || 'Unknown rejection';
          showError('Unhandled Promise Rejection:\n' + (reason.stack || reason.message || reason));
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
