<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO (JS will enhance per-page) -->
    <title>JBJ Global Real Estate | Dubai Property Brokerage</title>
    <meta name="description" content="JBJ Global Real Estate, founded by Jane Bou Jaoude, is Dubai's premier real estate brokerage. Buy, sell, or rent luxury properties in Dubai, UAE." />
    <link rel="canonical" href="https://jbj.ae" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  </head>

  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;background:#0a0a0a;color:#fff;min-height:100vh;">
        <h1>JBJ Global Real Estate | Dubai Property Experts</h1>
        <p>We're launching soon. Please enable JavaScript for the full experience.</p>
        <p>Contact: +971 56 591 1000 | contact@jbj.ae</p>
        <p style="margin-top:1rem;">
          <a href="/auth" style="display:inline-block;background:#d4af37;color:#000;padding:0.75rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;">Team Login</a>
        </p>
      </div>
    </noscript>

    <!-- 
      Boot fallback: Shows a minimal loading spinner while React initializes.
      Hidden immediately when React mounts via main.tsx.
      For SEO: Google renders JS, so this spinner is only visible briefly.
    -->
    <div id="boot-fallback" style="min-height:100vh;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:Poppins,sans-serif;">
      <div style="text-align:center;">
        <div style="width:48px;height:48px;border:3px solid rgba(212,175,55,0.2);border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem;"></div>
        <p style="color:rgba(255,255,255,0.6);font-size:14px;margin:0;">Loading...</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <!-- Kill any legacy service worker/caches that could trap visitors on an old build -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/sw-kill.js?cb=" + Date.now())
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
