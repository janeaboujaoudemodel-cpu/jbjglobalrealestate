    <!-- Kill any legacy service worker/caches that could trap visitors on an old build -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/sw-kill.js?cb=" + Date.now())
              .catch(function () {});
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>

    <!-- JBJ Splash: dark emerald with monogram, fades out once React mounts -->
    <div id="jbj-splash" aria-hidden="true">
      <img src="/jbj-monogram-light-on-dark.png" alt="" />
    </div>
    <script>
      (function(){
        var splash=document.getElementById('jbj-splash');
        if(!splash)return;
        var hidden=false;
        function hide(){if(hidden)return;hidden=true;splash.classList.add('jbj-splash-hide');
          setTimeout(function(){splash&&splash.parentNode&&splash.parentNode.removeChild(splash);
            try{document.documentElement.style.backgroundColor='';document.body.style.backgroundColor='';}catch(e){}
          },650);}
        var tries=0;
        var iv=setInterval(function(){
          tries++;
          if(window.__APP_MOUNTED__||document.querySelector('#root>*')){clearInterval(iv);hide();}
          else if(tries>120){clearInterval(iv);hide();}
        },80);
        window.addEventListener('load',function(){setTimeout(hide,1200);});
      })();
    </script>


    <!-- Boot diagnostic overlay - catches errors ONLY before React mounts -->
    <script>
      (function() {
        // Flag to track if app has mounted - once true, we let React handle errors
        window.__APP_MOUNTED__ = false;
        
        var overlay = null;
        function showError(msg) {
          // Only show boot overlay if app hasn't mounted yet
          // After mount, React error boundaries should handle errors
          if (window.__APP_MOUNTED__) {
            console.error('[Post-mount error - handled by React]:', msg);
            return;
          }
          if (overlay) return;
          overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#000;color:#fff;padding:2rem;font-family:monospace;overflow:auto;';
          overlay.innerHTML = '<h1 style="color:#f00;margin:0 0 1rem;">Boot Error</h1><pre style="white-space:pre-wrap;word-break:break-word;">' + msg + '</pre><p style="margin-top:1rem;color:#888;">Check DevTools Console for details.</p>';
          document.body.appendChild(overlay);
        }
        window.onerror = function(msg, src, line, col, err) {
          showError('Error: ' + msg + '\nSource: ' + src + ':' + line + ':' + col + (err && err.stack ? '\n\nStack:\n' + err.stack : ''));
        };
        window.onunhandledrejection = function(e) {
          var reason = e.reason || 'Unknown rejection';
          showError('Unhandled Promise Rejection:\n' + (reason.stack || reason.message || reason));
        };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
