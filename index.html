<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO (JS will enhance per-page) -->
    <title>JBJ Global Real Estate | Dubai Property Brokerage</title>
    <meta name="description" content="JBJ Global Real Estate, founded by Jane Bou Jaoude, is Dubai's premier real estate brokerage. Buy, sell, or rent luxury properties in Dubai, UAE." />
    <link rel="canonical" href="https://jbj.ae" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <style>
      /* Boot loading indicator - hidden once React mounts */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #d4af37;
        font-family: 'Poppins', sans-serif;
        font-size: 1.125rem;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      #boot-loader.hidden { opacity: 0; pointer-events: none; }
      /* Hide loader after 5 seconds max to prevent infinite loading */
      @keyframes autoHide {
        0%, 99% { opacity: 1; }
        100% { opacity: 0; pointer-events: none; }
      }
    </style>
    <!-- Inline script to auto-hide loader and show fallback after timeout -->
    <script>
      (function() {
        var loader = document.getElementById('boot-loader');
        var root = document.getElementById('root');
        // Auto-hide loader after 8 seconds if React hasn't mounted
        setTimeout(function() {
          if (loader && !loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
          }
        }, 8000);
        // Observe when React mounts content
        if (typeof MutationObserver !== 'undefined' && root) {
          var observer = new MutationObserver(function(mutations) {
            if (root.children.length > 0 && loader) {
              loader.classList.add('hidden');
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true });
        }
      })();
    </script>
  </head>

  <body>
    <!-- Boot loader: visible until React mounts -->
    <noscript>
      <div style="padding:2rem;text-align:center;background:#0a0a0a;color:#fff;min-height:100vh;">
        <h1>JBJ Global Real Estate | Dubai Property Experts</h1>
        <p>Please enable JavaScript to browse our luxury Dubai property listings.</p>
        <p>Contact: +971 4 XXX XXXX | info@jbj.ae</p>
      </div>
    </noscript>
    <div id="boot-loader" aria-hidden="true">Loading JBJ Global Real Estate...</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
