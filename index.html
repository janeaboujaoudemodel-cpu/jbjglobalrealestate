<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO (JS will enhance per-page) -->
    <title>JBJ Global Real Estate | Dubai Property Brokerage</title>
    <meta name="description" content="JBJ Global Real Estate, founded by Jane Bou Jaoude, is Dubai's premier real estate brokerage. Buy, sell, or rent luxury properties in Dubai, UAE." />
    <link rel="canonical" href="https://jbj.ae" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  </head>

  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;background:#0a0a0a;color:#fff;min-height:100vh;">
        <h1>JBJ Global Real Estate | Dubai Property Experts</h1>
        <p>We’re launching soon. Please enable JavaScript for the full experience.</p>
        <p>Contact: +971 56 591 1000 | contact@jbj.ae</p>
        <p style="margin-top:1rem;">
          <a href="/auth" style="display:inline-block;background:#d4af37;color:#000;padding:0.75rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;">Team Login</a>
        </p>
      </div>
    </noscript>

    <!-- Boot fallback: visible until React mounts, then hidden via JS -->
    <div id="boot-fallback" style="min-height:100vh;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:Poppins,sans-serif;">
      <div style="max-width:860px;width:100%;text-align:center;position:relative;">
        <div style="position:absolute;top:0;right:0;display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;">
          <a href="/?lang=en" style="color:#d4af37;text-decoration:none;">EN</a>
          <span style="color:rgba(212,175,55,0.5)">|</span>
          <a href="/?lang=ar" style="color:#d4af37;text-decoration:none;">AR</a>
        </div>

        <img src="/logo.png" alt="JBJ Monogram" style="height:180px;width:auto;margin:0 auto 1.25rem;display:block;" />

        <h1 style="color:#fff;font-size:44px;line-height:1.1;margin:0 0 0.75rem;font-weight:700;letter-spacing:-0.02em;">Coming Soon</h1>
        <p style="color:#d4af37;font-size:13px;letter-spacing:0.38em;text-transform:uppercase;margin:0 0 1.25rem;">JBJ Global Real Estate</p>

        <p style="color:rgba(255,255,255,0.65);font-size:16px;line-height:1.8;margin:0 auto 1.25rem;max-width:56ch;">We’re crafting something extraordinary for you.</p>
        <p style="color:rgba(255,255,255,0.45);font-size:12px;letter-spacing:0.22em;text-transform:uppercase;margin:0 0 1.75rem;">UAE Real Estate Brokerage</p>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="/auth" style="display:inline-block;background:#d4af37;color:#000;padding:0.85rem 1.4rem;border-radius:10px;text-decoration:none;font-weight:700;">Team Login</a>
          <button id="boot-reload" style="display:none;background:transparent;color:#d4af37;padding:0.85rem 1.4rem;border-radius:10px;border:1px solid rgba(212,175,55,0.45);font-weight:700;cursor:pointer;">Reload</button>
        </div>

        <p style="margin:1.5rem 0 0;color:rgba(255,255,255,0.45);font-size:12px;">WhatsApp: +971 56 591 1000 · Email: contact@jbj.ae</p>
      </div>
    </div>

    <!-- Kill any legacy service worker/caches that could trap visitors on an old build -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("/sw-kill.js?cb=" + Date.now())
              .catch(function () {});
          }
        } catch (e) {}

        window.setTimeout(function () {
          try {
            var btn = document.getElementById("boot-reload");
            if (btn) {
              btn.style.display = "inline-block";
              btn.addEventListener("click", function () {
                try {
                  window.location.reload();
                } catch (e) {}
              });
            }
          } catch (e) {}
        }, 8000);
      })();
    </script>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
