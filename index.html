<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO Meta Tags -->
    <title>JJ Global Capital | Premium UAE Real Estate Investment Advisory</title>
    <meta name="title" content="JJ Global Capital | Premium UAE Real Estate Investment Advisory" />
    <meta name="description" content="JJ Global Capital is the UAE's premier investment advisory for premium real estate. Trusted by high-net-worth investors worldwide for exclusive Dubai property investments, luxury off-plan projects, and personalized wealth management services. AED 2B+ Portfolio | 12+ Years Experience | 3900+ Properties Sold." />
    <meta name="author" content="JJ Global Capital" />
    <meta name="keywords" content="Dubai real estate, UAE property investment, luxury apartments Dubai, off-plan properties, Palm Jumeirah, Downtown Dubai, JJ Global Capital, investment advisory, premium real estate, HNWI investments, Dubai villas, property management UAE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jjglobalcapital.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jjglobalcapital.com/" />
    <meta property="og:title" content="JJ Global Capital | Premium UAE Real Estate Investment" />
    <meta property="og:description" content="Your trusted partner for premium real estate investments across the UAE's most exclusive communities. AED 2B+ Portfolio Value. 12+ Years Experience. 3900+ Properties Sold." />
    <meta property="og:image" content="https://jjglobalcapital.com/og-image.jpg" />
    <meta property="og:site_name" content="JJ Global Capital" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jjglobalcapital.com/" />
    <meta name="twitter:title" content="JJ Global Capital | Premium UAE Real Estate Investment" />
    <meta name="twitter:description" content="Your trusted partner for premium real estate investments across the UAE's most exclusive communities. AED 2B+ Portfolio." />
    <meta name="twitter:image" content="https://jjglobalcapital.com/og-image.jpg" />

    <!-- Structured Data - Organization with Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "JJ Global Capital",
      "url": "https://jjglobalcapital.com",
      "logo": "https://jjglobalcapital.com/logo.png",
      "description": "Premium UAE real estate investment advisory trusted by high-net-worth investors worldwide. AED 2B+ Portfolio Value, 12+ Years Experience, 3900+ Properties Sold.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Downtown Dubai",
        "addressCountry": "AE"
      },
      "telephone": "+971-56-591-1000",
      "email": "invest@jjglobalcapital.com",
      "sameAs": [
        "https://jjholdinggroup.com"
      ],
      "areaServed": {
        "@type": "Country",
        "name": "United Arab Emirates"
      },
      "priceRange": "$$$",
      "foundingDate": "2012",
      "founder": {
        "@type": "Person",
        "name": "Jane Abou Jaoude"
      },
      "numberOfEmployees": "50+",
      "slogan": "Your Gateway to Global Real Estate Investments & Concierge"
    }
    </script>

    <!-- Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://jjglobalcapital.com",
      "name": "JJ Global Capital",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jjglobalcapital.com/properties?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicon - JJ Global Capital Logo -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#A8925A" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
