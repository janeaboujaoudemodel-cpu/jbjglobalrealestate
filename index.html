<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO Meta Tags -->
    <title>JJ Global Capital | Premium UAE Real Estate Brokerage</title>
    <meta name="title" content="JJ Global Capital | Premium UAE Real Estate Brokerage" />
    <meta name="description" content="JJ Global Capital is the UAE's premier real estate brokerage for property sales, leasing, and holiday homes. Trusted by clients worldwide for exclusive Dubai properties and luxury off-plan projects." />
    <meta name="author" content="JJ Global Capital" />
    <meta name="keywords" content="Dubai real estate, UAE property brokerage, luxury apartments Dubai, off-plan properties, Palm Jumeirah, Downtown Dubai, JJ Global Capital, real estate brokerage, premium real estate, Dubai villas, holiday homes UAE" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jjglobalcapital.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jjglobalcapital.com/" />
    <meta property="og:title" content="JJ Global Capital | Real Estate Brokerage" />
    <meta property="og:description" content="Dubai-based real estate brokerage offering property sales, leasing, and holiday homes services. Serving UAE-based and international clients." />
    <meta property="og:image" content="https://jjglobalcapital.com/og-image.jpg" />
    <meta property="og:site_name" content="JJ Global Capital" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jjglobalcapital.com/" />
    <meta name="twitter:title" content="JJ Global Capital | Real Estate Brokerage" />
    <meta name="twitter:description" content="Dubai-based real estate brokerage offering property sales, leasing, and holiday homes services across the UAE." />
    <meta name="twitter:image" content="https://jjglobalcapital.com/og-image.jpg" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "JJ Global Capital",
      "url": "https://jjglobalcapital.com",
      "logo": "https://jjglobalcapital.com/logo.png",
      "description": "Dubai-based real estate brokerage offering property sales, leasing, and holiday homes services across the UAE.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AE"
      },
      "telephone": "+971-56-591-1000",
      "email": "contact@jjglobalcapital.com",
      "areaServed": {
        "@type": "Country",
        "name": "United Arab Emirates"
      }
    }
    </script>

    <!-- Sitelinks Search Box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "https://jjglobalcapital.com",
      "name": "JJ Global Capital",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jjglobalcapital.com/properties?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-192x192.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="msapplication-TileColor" content="#A8925A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JJ Capital" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
