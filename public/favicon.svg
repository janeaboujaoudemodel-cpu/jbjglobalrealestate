<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="30%" style="stop-color:#F5E6C8"/>
      <stop offset="50%" style="stop-color:#E8D5A3"/>
      <stop offset="70%" style="stop-color:#F5E6C8"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#F5E6C8;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <!-- Deep black circle background -->
  <circle cx="256" cy="256" r="256" fill="#0A0A0A"/>
  <!-- Subtle gold ring border -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Single bold J letter in gold gradient -->
  <text x="256" y="310" text-anchor="middle" font-family="'Poppins','Segoe UI',Arial,sans-serif" font-weight="700" font-size="280" fill="url(#goldGrad)">J</text>
</svg>