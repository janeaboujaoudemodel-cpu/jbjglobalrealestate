<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#042C1C"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="45%" stop-color="#F0DC9C"/>
      <stop offset="100%" stop-color="#B89555"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed emerald plate: maximum mass so the mark stays legible at 16px -->
  <rect width="512" height="512" rx="96" fill="url(#emerald)"/>
  <!-- JBJ monogram, optically centered, filling the plate -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" text-anchor="middle">
    <text x="256" y="348" font-size="248" fill="#FFFFFF" letter-spacing="-2">J<tspan fill="url(#gold)">B</tspan>J</text>
  </g>
</svg>
