name: Contrast Regression Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contrast:
    # This job is the merge gate. Mark it as a Required Status Check in
    # GitHub branch protection so any new contrast regression — tokens,
    # faded-gold, low-opacity text, white-on-light, black-on-dark, or
    # same-tone (vs the committed baseline) — blocks the merge button.
    name: Contrast PR Gate (blocks merges)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Default GITHUB_TOKEN in this repo is read-only, so the "Post PR
    # summary" step's issues.createComment call 403s on every run
    # ("Resource not accessible by integration") without this.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ---------- PR Gate: blocking static guards (fast, run first) ----------
      # Any failure here blocks the merge. Covers all six static contrast
      # layers. Same-tone is compared against
      # scripts/contrast/same-tone-baseline.json so only NEW files /
      # higher counts fail. Captures stdout/stderr so we can post a
      # focused PR comment listing exactly which files regressed.
      - name: PR Gate — tokens + faded-gold + low-opacity + white-on-light + black-on-dark + same-tone
        id: pr_gate
        run: |
          mkdir -p artifacts/contrast
          set +e
          npm run check:contrast:pr-gate 2>&1 | tee artifacts/contrast/pr-gate.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status


      # ---------- Layer 2: rendered pages (Playwright + axe) ----------
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      # JBJ-031. A circular import between emitted chunks means one chunk
      # runs before its dependency is initialised — a blank-page boot
      # failure in production. This exact bug shipped and took every route
      # down while unit tests, the build, and the rendered sweep below all
      # reported green, because none of them read the built bundle. Runs
      # here because this job already has a build.
      - name: Check for circular chunk dependencies
        run: npm run check:chunks

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

      # JBJ-031. The contrast sweep below reported "0 violations" on all 56
      # routes while the site was rendering nothing at all — axe found no
      # bad colour pairs because there were no elements. Assert the app
      # actually mounts before trusting any rendered check.
      - name: Assert the app boots
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const b = await chromium.launch();
              const p = await b.newPage();
              const errors = [];
              p.on("pageerror", (e) => errors.push(e.message));
              await p.goto("http://localhost:8080/", { waitUntil: "networkidle" });
              await p.waitForTimeout(2000);
              const len = await p.evaluate(
                () => document.getElementById("root")?.innerHTML.length ?? -1
              );
              await b.close();
              if (errors.length) {
                console.error("Page errors on boot:\n  " + errors.join("\n  "));
              }
              if (len <= 0) {
                console.error(`#root is empty (innerHTML length ${len}) — the app did not mount.`);
                process.exit(1);
              }
              if (errors.length) process.exit(1);
              console.log(`✓ App mounted (#root innerHTML ${len} chars), no page errors.`);
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Run rendered contrast sweep (axe color-contrast)
        env:
          PREVIEW_URL: http://localhost:8080
        run: npm run check:contrast:rendered

      - name: Upload contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: artifacts/contrast/
          if-no-files-found: warn
          retention-days: 30

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tokens = 'artifacts/contrast/tokens.json';
            const rendered = 'artifacts/contrast/rendered.md';
            const gateLog = 'artifacts/contrast/pr-gate.log';
            const gateOutcome = '${{ steps.pr_gate.outcome }}';

            let body = '## 🎨 Contrast Regression Check\n\n';

            // PR Gate block — most prominent, mergers see this first.
            if (gateOutcome === 'failure') {
              body += '### ❌ PR Gate: BLOCKED — merge disabled\n\n';
              body += 'A new contrast regression was introduced. The gate covers: design tokens (WCAG AA), faded-gold, low-opacity text, white-on-light, black-on-dark, and same-tone (vs committed baseline).\n\n';
              if (fs.existsSync(gateLog)) {
                const log = fs.readFileSync(gateLog, 'utf8').trim();
                const trimmed = log.length > 6000 ? log.slice(-6000) : log;
                body += '<details open><summary>Gate output</summary>\n\n```\n' + trimmed + '\n```\n\n</details>\n\n';
              }
              body += '**How to fix:**\n';
              body += '- **Tokens:** adjust the offending HSL pair in `src/index.css` or allowlist it in `scripts/contrast/allowlist.json` with a documented reason.\n';
              body += '- **Faded-gold:** replace `text-gold/XX` (XX < 80) with solid `text-gold` or `text-[#1A1A1A]/70`.\n';
              body += '- **Low-opacity:** raise `text-*/NN` to `/60`+ or use `text-muted-foreground`. Decorative? Add `// contrast-ok` on the line.\n';
              body += '- **White-on-light / black-on-dark:** flip the text colour to match the wrapper surface.\n';
              body += '- **Same-tone:** fix the new file (swap `text-[#1A1A1A]` to `text-white` on dark wrappers). If intentional, refresh the baseline with `node scripts/contrast/check-same-tone.mjs --print-baseline > scripts/contrast/same-tone-baseline.json` and commit it — note that loosening the baseline is a reviewable change.\n';
              body += '- Branded watermarks may be allowlisted via `/admin/faded-gold-allowlist` (commit the updated `scripts/contrast/faded-gold-allowlist.json`).\n\n';
            } else if (gateOutcome === 'success') {
              body += '### ✅ PR Gate: passed (no new contrast regressions)\n\n';
            }


            if (fs.existsSync(tokens)) {
              const t = JSON.parse(fs.readFileSync(tokens, 'utf8'));
              const fails = t.results.filter(r => r.status === 'fail').length;
              const allow = t.results.filter(r => r.status === 'allowlisted').length;
              body += `**Tokens:** ${t.results.length} pairs · ${fails} fail · ${allow} allowlisted\n\n`;
            }
            if (fs.existsSync(rendered)) {
              body += fs.readFileSync(rendered, 'utf8');
            } else if (gateOutcome !== 'failure') {
              body += '_Rendered sweep did not produce a report (likely failed before completion). See workflow logs._\n';
            }
            // Always write the report to the job summary. This needs no
            // token permissions, so the report survives even when the
            // comment below is refused.
            await core.summary.addRaw(body).write();

            // Posting the PR comment is best-effort. The repository's
            // Actions setting caps GITHUB_TOKEN to read-only, and a
            // workflow-level `permissions:` block can only narrow that cap,
            // never widen it — so this call 403s until someone changes
            // Settings -> Actions -> General -> Workflow permissions
            // (JBJ-022). Letting it throw made this job report `failure`
            // on runs where the actual check had PASSED, which is worse
            // than not having the comment: it trains everyone to ignore a
            // red gate. The real pass/fail is carried by the check step's
            // own exit code, not by whether a comment posted.
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (err) {
              if (err.status === 403) {
                core.warning(
                  'Could not post the PR comment: GITHUB_TOKEN is read-only ' +
                  '(JBJ-022). The full report is in this job\'s summary. Fix via ' +
                  'Settings -> Actions -> General -> Workflow permissions.'
                );
              } else {
                core.warning(`Could not post the PR comment: ${err.message}`);
              }
            }
