name: Contrast Regression Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contrast:
    # This job is the merge gate. Mark it as a Required Status Check in
    # GitHub branch protection so any new contrast regression — tokens,
    # faded-gold, low-opacity text, white-on-light, black-on-dark, or
    # same-tone (vs the committed baseline) — blocks the merge button.
    name: Contrast PR Gate (blocks merges)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ---------- PR Gate: blocking static guards (fast, run first) ----------
      # Any failure here blocks the merge. Covers all six static contrast
      # layers. Same-tone is compared against
      # scripts/contrast/same-tone-baseline.json so only NEW files /
      # higher counts fail. Captures stdout/stderr so we can post a
      # focused PR comment listing exactly which files regressed.
      - name: PR Gate — tokens + faded-gold + low-opacity + white-on-light + black-on-dark + same-tone
        id: pr_gate
        run: |
          mkdir -p artifacts/contrast
          set +e
          npm run check:contrast:pr-gate 2>&1 | tee artifacts/contrast/pr-gate.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status


      # ---------- Layer 2: rendered pages (Playwright + axe) ----------
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run rendered contrast sweep (axe color-contrast)
        env:
          PREVIEW_URL: http://localhost:8080
        run: npm run check:contrast:rendered

      - name: Upload contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: artifacts/contrast/
          if-no-files-found: warn
          retention-days: 30

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tokens = 'artifacts/contrast/tokens.json';
            const rendered = 'artifacts/contrast/rendered.md';
            const gateLog = 'artifacts/contrast/pr-gate.log';
            const gateOutcome = '${{ steps.pr_gate.outcome }}';

            let body = '## 🎨 Contrast Regression Check\n\n';

            // PR Gate block — most prominent, mergers see this first.
            if (gateOutcome === 'failure') {
              body += '### ❌ PR Gate: BLOCKED\n\n';
              body += 'New faded-gold or low-opacity-white usage was introduced. ';
              body += 'Merge is blocked until these are resolved or allowlisted.\n\n';
              if (fs.existsSync(gateLog)) {
                const log = fs.readFileSync(gateLog, 'utf8').trim();
                const trimmed = log.length > 6000 ? log.slice(-6000) : log;
                body += '<details><summary>Gate output</summary>\n\n```\n' + trimmed + '\n```\n\n</details>\n\n';
              }
              body += '**How to fix:**\n';
              body += '- Replace `text-gold/XX` (XX < 80) with solid `text-gold` or `text-gray-400…900`.\n';
              body += '- Replace `text-white/XX` (XX < 90) on light surfaces with `text-foreground` / `text-zinc-900`.\n';
              body += '- For legitimate branded watermarks, owners can allowlist files via `/admin/faded-gold-allowlist` and commit the updated `scripts/contrast/faded-gold-allowlist.json`.\n\n';
            } else if (gateOutcome === 'success') {
              body += '### ✅ PR Gate: passed (no faded-gold or low-opacity-white regressions)\n\n';
            }

            if (fs.existsSync(tokens)) {
              const t = JSON.parse(fs.readFileSync(tokens, 'utf8'));
              const fails = t.results.filter(r => r.status === 'fail').length;
              const allow = t.results.filter(r => r.status === 'allowlisted').length;
              body += `**Tokens:** ${t.results.length} pairs · ${fails} fail · ${allow} allowlisted\n\n`;
            }
            if (fs.existsSync(rendered)) {
              body += fs.readFileSync(rendered, 'utf8');
            } else if (gateOutcome !== 'failure') {
              body += '_Rendered sweep did not produce a report (likely failed before completion). See workflow logs._\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
