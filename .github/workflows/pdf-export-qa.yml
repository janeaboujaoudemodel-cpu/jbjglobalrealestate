name: PDF Export QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pdf-qa:
    name: Validate PDF exports
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright Chromium
        # `npx playwright` resolves to node_modules/.bin/playwright, which npm
        # points at @playwright/test's CLI. Even though package.json now pins
        # `playwright` and `@playwright/test` to the same version, invoking
        # the `playwright` package's own CLI directly is still the more
        # robust choice — it guarantees the installed browser always matches
        # what check-exports.mjs actually launches via
        # `import { chromium } from "playwright"`, regardless of any future
        # version drift between the two packages.
        #
        # Separately: check-exports.mjs calls the raw `chromium.launch()` API
        # (not the @playwright/test runner), which resolves to the separate
        # chromium-headless-shell binary by default. Installing only
        # "chromium" leaves that binary missing and launch() fails with
        # "Executable doesn't exist at .../chromium_headless_shell-*/...", so
        # both targets must be requested explicitly.
        run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run PDF QA gate
        env:
          PREVIEW_URL: http://localhost:8080
        run: node scripts/pdf-qa/check-exports.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-qa-report
          path: artifacts/pdf-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/pdf-qa/report.md';
            if (!fs.existsSync(path)) {
              core.warning('No PDF QA report generated.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            // Posting the summary is a convenience, not the gate. This repo's
            // Actions setting is Read-only workflow permissions, which overrides
            // the `issues: write` declared above, so createComment 403s with
            // "Resource not accessible by integration" on every PR (ROADMAP
            // JBJ-022). Unhandled, that 403 failed the whole job — so a run whose
            // contrast checks had all passed still reported red, and on the job
            // named "blocks merges" that is a gate reporting a failure that did
            // not happen. The real check's own exit status decides the outcome;
            // an unpostable comment only warns.
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (err) {
              core.warning(
                `Could not post the PR summary comment (${err.status ?? 'unknown'}: ${err.message}). ` +
                'This does not affect the check result — see ROADMAP JBJ-022 ' +
                '(Settings -> Actions -> General -> Workflow permissions).'
              );
              core.summary.addRaw(body);
              await core.summary.write();
            }
