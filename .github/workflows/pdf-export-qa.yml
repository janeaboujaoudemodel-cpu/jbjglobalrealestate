name: PDF Export QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pdf-qa:
    name: Validate PDF exports
    runs-on: ubuntu-latest
    # 30, not 20: measured 17m43s on 2026-08-17, against a sibling job that
    # was cancelled at the 20-minute ceiling on the same run. Rendering and
    # rasterising every PDF export is not getting faster.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job-scoped GITHUB_TOKEN in .git/config where any
          # later step (or a compromised dependency) could read and reuse it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright Chromium
        # `npx playwright` resolves to node_modules/.bin/playwright, which npm
        # points at @playwright/test's CLI. Even though package.json now pins
        # `playwright` and `@playwright/test` to the same version, invoking
        # the `playwright` package's own CLI directly is still the more
        # robust choice — it guarantees the installed browser always matches
        # what check-exports.mjs actually launches via
        # `import { chromium } from "playwright"`, regardless of any future
        # version drift between the two packages.
        #
        # Separately: check-exports.mjs calls the raw `chromium.launch()` API
        # (not the @playwright/test runner), which resolves to the separate
        # chromium-headless-shell binary by default. Installing only
        # "chromium" leaves that binary missing and launch() fails with
        # "Executable doesn't exist at .../chromium_headless_shell-*/...", so
        # both targets must be requested explicitly.
        run: node node_modules/playwright/cli.js install --with-deps chromium chromium-headless-shell

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run PDF QA gate
        env:
          PREVIEW_URL: http://localhost:8080
        run: node scripts/pdf-qa/check-exports.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-qa-report
          path: artifacts/pdf-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Post PR summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = 'artifacts/pdf-qa/report.md';
            if (!fs.existsSync(path)) {
              core.warning('No PDF QA report generated.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            // Posting the summary is reporting, not gating. A transient GitHub
            // API failure here (500 "No server is currently available", or the
            // 403 this repo hits when workflow permissions are tight) used to
            // fail the whole job, marking a gate that PASSED as red — which is
            // how a green Contrast gate and a passing PDF QA both showed up as
            // failures on PR #44. Warn and carry on; the gate's own result is
            // decided by the steps above.
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (err) {
              core.warning(`Could not post the PR summary comment: ${err.message}. The gate result above is unaffected.`);
            }
