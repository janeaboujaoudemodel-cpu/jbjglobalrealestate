name: Footer ModeSwitcher Overlay Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  modeswitcher-overlay:
    name: Footer ModeSwitcher never overlays header
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run footer ModeSwitcher overlay regression
        env:
          PREVIEW_URL: http://localhost:8080
        run: npx playwright test tests/footer-modeswitcher-overlay.spec.ts --reporter=list

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footer-modeswitcher-overlay-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
