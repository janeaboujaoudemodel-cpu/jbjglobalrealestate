name: Unit Tests

# Runs the Vitest unit test suite (src/**/*.test.ts, src/**/*.spec.ts) on
# every push/PR touching source. Added Aug 2026 alongside the first
# business-logic tests (payment schedule, brokerage revenue) — previously
# there was no general-purpose workflow that ran `vitest run` at all; the
# only existing CI use of Vitest was scoped to two specific contrast-guard
# files inside pass-142-heading-contrast.yml.
#
# This workflow reports pass/fail on every PR but does not by itself block
# merges — see the CTO report's note on confirming GitHub branch protection
# / required status checks if you want it to gate merges.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "vitest.config.ts"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "vitest.config.ts"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # `npm ci` refuses to run whenever package.json and package-lock.json
        # disagree — currently they do: package.json declares 17 `overrides`
        # that the lockfile records none of, so every job here died in under a
        # second before running anything at all. Falling back to `npm install`
        # keeps CI useful, and the warning keeps the drift visible instead of
        # letting a green run imply the lockfile is fine. Remove the fallback
        # once `npm install` has been run and the regenerated lockfile
        # committed (see ROADMAP JBJ-024).
        # An `if` condition is exempt from `set -e`, which the default
        # `bash -e {0}` shell applies — a plain `npm ci || npm install` would
        # abort the step on the first failure instead of falling through.
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "::warning title=Lockfile out of sync::npm ci failed; fell back to npm install. Regenerate package-lock.json (see ROADMAP JBJ-024)."
            npm install --no-audit --no-fund
          fi

      - name: Run unit tests
        run: npm run test
