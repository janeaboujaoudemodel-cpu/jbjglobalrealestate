name: Tool Emerald Visual Regression
on:
  pull_request:
    paths:
      - "src/pages/**"
      - "src/components/tools/**"
      - "src/components/ai-tools/**"
      - "src/index.css"
      - "scripts/tool-emerald-audit/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - name: Add pngjs
        run: bun add -d pngjs
      - name: Start dev server
        run: |
          bun run dev &
          for i in {1..40}; do
            curl -sf http://localhost:8080 && break || sleep 2
          done
      - name: Run tool emerald audit
        run: node scripts/tool-emerald-audit/run.mjs
        env:
          TOOL_AUDIT_BASE_URL: http://localhost:8080
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-emerald-audit
          path: scripts/tool-emerald-audit/artifacts
