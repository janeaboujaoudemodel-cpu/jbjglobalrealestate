name: Report Pill Snapshot

on:
  pull_request:
    paths:
      - "src/components/ai-home-finder/report/**"
      - "src/components/ai-home-finder/ReportPreviewModal.tsx"
      - "src/utils/renderReportToPdf.ts"
      - "src/pages/__ReportContrastHarness.tsx"
      - "scripts/report-pill-snapshot/**"
      - ".github/workflows/report-pill-snapshot.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job-scoped GITHUB_TOKEN in .git/config where any
          # later step (or a compromised dependency) could read and reuse it.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: python -m pip install --upgrade pip playwright pillow

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install node deps
        run: npm ci

      # The harness this snapshot targets, /__report-contrast, is registered
      # behind `import.meta.env.DEV` in src/routes/PublicRoutes.tsx so the debug
      # route never ships in a production bundle. This step used to `npm run
      # build` and serve the result with `vite preview`, where DEV is false — so
      # the route did not exist, `[data-report-page]` never appeared, and all
      # three viewports timed out.
      #
      # `npx vite dev` rather than `npm run dev`: the latter runs the `predev`
      # sitemap generator, which needs a database this job has no reason to
      # reach and rewrites a tracked file for nothing.
      - name: Start dev server
        run: |
          npx vite dev --port 8080 --host 127.0.0.1 &
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8080 >/dev/null && break
            sleep 2
          done

      - name: Run pill snapshot test
        env:
          REPORT_SNAPSHOT_BASE_URL: http://127.0.0.1:8080
        run: python3 scripts/report-pill-snapshot/run.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-pill-snapshot
          path: scripts/report-pill-snapshot/artifacts
