name: Report Pill Snapshot

on:
  pull_request:
    paths:
      - "src/components/ai-home-finder/report/**"
      - "src/components/ai-home-finder/ReportPreviewModal.tsx"
      - "src/utils/renderReportToPdf.ts"
      - "src/pages/__ReportContrastHarness.tsx"
      - "scripts/report-pill-snapshot/**"
      - ".github/workflows/report-pill-snapshot.yml"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python deps
        run: python -m pip install --upgrade pip playwright pillow

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install node deps
        # `npm ci` refuses to run whenever package.json and package-lock.json
        # disagree — currently they do: package.json declares 17 `overrides`
        # that the lockfile records none of, so every job here died in under a
        # second before running anything at all. Falling back to `npm install`
        # keeps CI useful, and the warning keeps the drift visible instead of
        # letting a green run imply the lockfile is fine. Remove the fallback
        # once `npm install` has been run and the regenerated lockfile
        # committed (see ROADMAP JBJ-024).
        # An `if` condition is exempt from `set -e`, which the default
        # `bash -e {0}` shell applies — a plain `npm ci || npm install` would
        # abort the step on the first failure instead of falling through.
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "::warning title=Lockfile out of sync::npm ci failed; fell back to npm install. Regenerate package-lock.json (see ROADMAP JBJ-024)."
            npm install --no-audit --no-fund
          fi

      # The harness this snapshot targets, /__report-contrast, is registered
      # behind `import.meta.env.DEV` in src/routes/PublicRoutes.tsx so the debug
      # route never ships in a production bundle. This step used to `npm run
      # build` and serve the result with `vite preview`, where DEV is false — so
      # the route did not exist, `[data-report-page]` never appeared, and all
      # three viewports timed out.
      #
      # `npx vite dev` rather than `npm run dev`: the latter runs the `predev`
      # sitemap generator, which needs a database this job has no reason to
      # reach and rewrites a tracked file for nothing.
      - name: Start dev server
        run: |
          npx vite dev --port 8080 --host 127.0.0.1 &
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8080 >/dev/null && break
            sleep 2
          done

      - name: Run pill snapshot test
        env:
          REPORT_SNAPSHOT_BASE_URL: http://127.0.0.1:8080
        run: python3 scripts/report-pill-snapshot/run.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-pill-snapshot
          path: scripts/report-pill-snapshot/artifacts
